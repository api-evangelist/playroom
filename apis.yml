name: Playroom
description: >-
  Playroom (Playroom Kit) is a client-side developer platform for building
  multiplayer apps and games in minutes. Its single JavaScript/TypeScript SDK
  (npm playroomkit) provides synchronized global and per-player state, an elected
  host model, remote procedure calls (RPCs), matchmaking and lobbies, on-screen
  joystick/gamepad controllers, bots, and turn-based helpers, with wrappers for
  Unity (C#) and Godot and support across React, Next.js, Vue, Angular, Remix,
  Phaser, and React Three Fiber. Apps authenticate with a read-only gameId issued
  from the Dev Portal rather than a server API key, and Playroom hosts the
  realtime infrastructure. It also embeds into Discord Activities and TikTok Live.
  Surfaced as a 500 Global portfolio company and enriched into the API Evangelist
  network.
